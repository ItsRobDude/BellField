packages:
  - apps/*
  - packages/*

# pnpm 11 blocks dependency build scripts unless allowed. These six ran their
# scripts under pnpm 10 (native binaries + the repo's git-hook installer).
allowBuilds:
  '@nestjs/core': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true

# Moved from package.json "pnpm.overrides" — pnpm 11 reads overrides here.
overrides:
  'postcss@<=8.5.17': '8.5.18'
  'qs@6.15.1': '6.15.2'
  '@xmldom/xmldom@0.8.12': '0.8.13'
  'body-parser@2.2.2': '2.3.0'
  'brace-expansion@5.0.5': '5.0.8'
  'shell-quote': '1.9.0'
  '@babel/core@7.29.0': '7.29.7'
  'js-yaml@4.1.1': '4.3.0'
  'sharp@0.34.5': '0.35.3'
  'ws@7.5.10': '7.5.11'
  'ws@8.20.0': '8.21.0'
  'multer@2.1.1': '2.2.0'
  'uuid@7.0.3': '11.1.1'
