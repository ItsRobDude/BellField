packages:
  - apps/*
  - packages/*

# pnpm 11 checks node_modules freshness before every `pnpm run` and
# auto-reinstalls on mismatch. After the release script's --prod deploys mark
# the workspace state stale, that auto-install production-prunes the workspace
# mid-pipeline (deleting dev deps like simple-git-hooks, which then fails the
# prepare hook). Installs here are always explicit — frozen in CI, deliberate
# locally — so the pre-run check is disabled.
verifyDepsBeforeRun: false

# pnpm 11 blocks dependency build scripts unless allowed. These six ran their
# scripts under pnpm 10 (native binaries + the repo's git-hook installer).
allowBuilds:
  '@nestjs/core': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true

# Moved from package.json "pnpm.overrides" — pnpm 11 reads overrides here.
overrides:
  'postcss@8.4.31': '8.5.15'
  'qs@6.15.1': '6.15.2'
  '@xmldom/xmldom@0.8.12': '0.8.13'
  'brace-expansion@5.0.5': '5.0.6'
  'shell-quote': '1.8.4'
  '@babel/core@7.29.0': '7.29.7'
  'js-yaml@4.1.1': '4.2.0'
  'ws@7.5.10': '7.5.11'
  'ws@8.20.0': '8.21.0'
  'multer@2.1.1': '2.2.0'
  'uuid@7.0.3': '11.1.1'
