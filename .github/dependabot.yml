version: 2
updates:
  # One npm job at the workspace root. pnpm workspaces must be updated from the root
  # (Dependabot refuses subdirectory updates when pnpm-lock.yaml and pnpm-workspace.yaml
  # live in a parent directory), and listing /apps/* and /packages/* on top of / made the
  # job evaluate every dependency once per directory — 355 checks for 58 unique packages —
  # and hit Dependabot's job time limit every week without ever opening a PR.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Expo owns these versions: field-mobile pins them per Expo SDK release and
      # `expo install --fix` is the supported way to move them together. react and
      # react-dom are Expo-pinned too, but office-web pins its own copies, so a
      # root-level ignore would freeze both; they stay open to review case by case.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:30'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 2
