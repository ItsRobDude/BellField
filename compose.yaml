services:
  postgres:
    image: postgres:16
    container_name: bellfield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bellfield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bellfield-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bellfield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bellfield-postgres-data:
